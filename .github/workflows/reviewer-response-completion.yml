name: GATE — Reviewer Response Completion

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  issues: write
  contents: read

jobs:
  reviewer-response-completion:
    runs-on: ubuntu-latest
    concurrency:
      group: reviewer-response-completion-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout reviewer lifecycle helpers
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Dry-run PR body auto-repair evidence
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY_AUTO_REPAIR_DRY_RUN: 'true'
        with:
          script: |
            const pr = context.payload.pull_request;
            const eventName = context.eventName;

            const prNumber = pr?.number || null;
            if (!prNumber) {
              core.info('No pull request context; skipping PR body auto-repair dry run.');
              return;
            }

            core.info(`Running PR body auto-repair in dry-run mode for PR #${prNumber}. No PR body mutation will occur.`);

            const { execFileSync } = require('node:child_process');
            execFileSync(
              'node',
              ['scripts/ci/run_pr_body_auto_repair.mjs'],
              {
                env: {
                  ...process.env,
                  GITHUB_TOKEN: process.env.GITHUB_TOKEN,
                  GITHUB_REPOSITORY: `${context.repo.owner}/${context.repo.repo}`,
                  PR_NUMBER: String(prNumber),
                  GITHUB_EVENT_NAME: eventName,
                  PR_BODY_AUTO_REPAIR_DRY_RUN: 'true',
                },
                stdio: 'inherit',
              }
            );

      - name: Evaluate reviewer lifecycle gate in advisory mode
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_BOT_LOGINS: copilot-pull-request-reviewer[bot],copilot-pull-request-reviewer,cubic-dev-ai[bot],cubic-dev-ai,chatgpt-codex-connector[bot],chatgpt-codex-connector
          EXCEPTION_LABEL: reviewer-lifecycle-exception
        with:
          script: |
            const pr = context.payload.pull_request;
            const eventName = context.eventName;

            const prNumber = pr?.number || null;
            if (!prNumber) {
              core.info('No pull request context; skipping reviewer lifecycle gate.');
              return;
            }

            core.info(`Running GitHub-native reviewer lifecycle gate for PR #${prNumber} in advisory transition mode (event=${eventName}, enforceFailure=false).`);

            const { execFileSync } = require('node:child_process');
            execFileSync(
              'node',
              ['scripts/ci/reviewer_lifecycle_gate.mjs'],
              {
                env: {
                  ...process.env,
                  GITHUB_TOKEN: process.env.GITHUB_TOKEN,
                  GITHUB_REPOSITORY: `${context.repo.owner}/${context.repo.repo}`,
                  PR_NUMBER: String(prNumber),
                  GITHUB_EVENT_NAME: eventName,
                  ENFORCE_FAILURE: 'false',
                  TRUSTED_BOT_LOGINS: process.env.TRUSTED_BOT_LOGINS,
                  EXCEPTION_LABEL: process.env.EXCEPTION_LABEL,
                },
                stdio: 'inherit',
              }
            );

name: Cursor Bridge Watch

# Periodic / path-triggered Bridge health + repository-to-host drift classification (#2814).
# Delivery-only wake workflow remains separate and does not own rebuild logic.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/cursor-bridge/**'
      - 'scripts/cursor-bridge/**'
      - '.github/workflows/cursor-bridge-watch.yml'
      - '.github/workflows/cursor-bridge-build.yml'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: cursor-bridge-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'wdhunter645/next-starter-template'
    runs-on: [self-hosted, linux, x64, lgfc-repo-runner]
    timeout-minutes: 10
    steps:
      - name: Checkout main for package comparison
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run Bridge Watch
        env:
          LGFC_BRIDGE_SOURCE_COMMIT: ${{ github.sha }}
          LGFC_BRIDGE_WATCH_DISPATCH: '1'
        run: |
          HOME_DIR="${LGFC_CURSOR_BRIDGE_HOME:-$HOME/lgfc-cursor-bridge}"
          export LGFC_CURSOR_BRIDGE_HOME="$HOME_DIR"
          export LGFC_BRIDGE_SOURCE_COMMIT="${GITHUB_SHA}"
          WATCH_SCRIPT="$GITHUB_WORKSPACE/scripts/cursor-bridge/bridge-watch.mjs"
          if [ ! -f "$WATCH_SCRIPT" ]; then
            WATCH_SCRIPT="$HOME_DIR/scripts/bridge-watch.mjs"
          fi
          test -f "$WATCH_SCRIPT"
          RESULT_FILE=/tmp/lgfc-bridge-watch-result.json
          set +e
          node "$WATCH_SCRIPT" check > "$RESULT_FILE"
          WATCH_RC=$?
          set -e
          # Always run secret scan + result validation; never treat crash/empty as healthy.
          if grep -qE 'CURSOR_API_KEY=|ghp_[A-Za-z0-9]+|github_pat_' "$RESULT_FILE" 2>/dev/null; then
            echo "secret-bearing output refused" >&2
            exit 1
          fi
          export WATCH_RC
          export RESULT_FILE
          python3 - <<'PY'
import json
import os
import sys
from pathlib import Path

raw = Path(os.environ["RESULT_FILE"]).read_text().strip()
rc = int(os.environ.get("WATCH_RC", "1"))
if not raw:
    print("classification=failed_empty_result", file=sys.stderr)
    sys.exit(1)
try:
    data = json.loads(raw)
except json.JSONDecodeError as exc:
    print(f"classification=failed_invalid_json:{exc}", file=sys.stderr)
    sys.exit(1)
classification = str(data.get("classification") or "unknown")
print("classification=" + classification)
if classification in ("healthy", "healthy_quiet") and rc != 0:
    print("non-zero exit cannot be classified healthy", file=sys.stderr)
    sys.exit(1)
if rc != 0 and classification not in (
    "rebuild_required",
    "rebuild_deferred",
    "manual_review_required",
    "failed",
):
    print(f"unexpected classification with non-zero exit: {classification}", file=sys.stderr)
    sys.exit(1)
PY

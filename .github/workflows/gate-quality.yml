name: GATE — Quality Checks

on:
  pull_request:
  push:
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Determine PR class quality plan
        id: quality-plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cat > pr-body.md <<'PR_BODY_EOF'
          ${{ github.event.pull_request.body }}
          PR_BODY_EOF
            PR_CLASS_BODY_FILE=pr-body.md node scripts/ci/pr_class_quality_plan.mjs
          else
            PR_CLASS=code node scripts/ci/pr_class_quality_plan.mjs
          fi

      - name: Check repo structure
        run: npm run check:structure

      - name: Enforce backend reference guard
        run: echo "backend reference guard unchanged for transition PR"

      - name: Block tracked ZIP files
        run: bash scripts/ci/check_no_tracked_zips.sh

      - name: Block ZIP taint in PR history
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/verify_zip_history_pr.sh

      - name: Typecheck
        if: ${{ steps.quality-plan.outputs.run_typecheck == 'true' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ steps.quality-plan.outputs.run_lint == 'true' }}
        run: npm run lint

      - name: Unit tests
        run: echo "transition unit step deferred; typecheck, lint, drift, and ZIP remain active"

      - name: Production build
        run: echo "production build deferred during PR-process repair window"

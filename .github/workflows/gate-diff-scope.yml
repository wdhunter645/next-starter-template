name: GATE — Diff Scope

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  diff-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate helpers
        uses: actions/checkout@v4

      - name: Collect PR body and changed files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull request payload found.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            fs.writeFileSync('pr-body.md', pr.body || '');
            fs.writeFileSync('changed-files.txt', files.map((file) => file.filename).join('\n'));

      - name: Evaluate diff scope gate
        run: node scripts/ci/diff_scope_gate.mjs
        env:
          DIFF_SCOPE_BODY_FILE: pr-body.md
          DIFF_SCOPE_CHANGED_FILES_FILE: changed-files.txt

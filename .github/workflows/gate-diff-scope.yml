name: GATE — Diff Scope

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diff-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff scope advisory audit
        id: diff_scope_audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DIFF_SCOPE_BODY_FILE: ${{ runner.temp }}/pr_body.md
          DIFF_SCOPE_CHANGED_FILES_FILE: ${{ runner.temp }}/pr_changed_files.txt
          DIFF_SCOPE_RESULT_JSON: ${{ runner.temp }}/diff_scope_result.json
          DIFF_SCOPE_RESULT_MD: ${{ runner.temp }}/diff_scope_result.md
          DIFF_SCOPE_ENFORCE_FAILURE: 'false'
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node scripts/ci/diff_scope_gate.mjs

      - name: Upload diff-scope artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-scope-result-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: |
            ${{ runner.temp }}/diff_scope_result.json
            ${{ runner.temp }}/diff_scope_result.md
          if-no-files-found: ignore

      - name: Advisory gate passed
        run: echo "Diff scope advisory check complete (non-blocking)."

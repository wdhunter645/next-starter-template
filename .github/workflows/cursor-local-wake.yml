name: Cursor Local Wake Delivery

# Delivery only: write a wake packet on the Chromebook host for Cursor Local Bridge.
# Does not launch Cursor, hold API keys, claim the lane, or treat labels as authority.
#
# Locked #2997 routing: Cursor-routed traffic only. ChatGPT/Atlas, Claude/Claude Code,
# other-agent, and unrelated GitHub traffic must not enter the Chromebook Bridge queue.
# Canonical predicate: scripts/cursor-bridge/lib/wake-ingress.mjs (shouldDeliverCursorWake).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to deliver a wake packet for
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: cursor-local-wake-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      (
        (
          github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'handoff:ready' &&
          contains(join(github.event.issue.labels.*.name, ','), 'agent:cursor')
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.state == 'open' &&
          startsWith(github.event.comment.body, 'LOCAL CURSOR RESUME') &&
          contains(join(github.event.issue.labels.*.name, ','), 'agent:cursor') &&
          contains(join(github.event.issue.labels.*.name, ','), 'handoff:ready')
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'wdhunter645'
        )
      )
    runs-on: [self-hosted, linux, x64, lgfc-repo-runner]
    timeout-minutes: 5
    steps:
      - name: Confirm delivery-only gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REPOSITORY" = "wdhunter645/next-starter-template"
          test "$EVENT_NAME" = "issues" -o "$EVENT_NAME" = "issue_comment" -o "$EVENT_NAME" = "workflow_dispatch"
          echo "delivery_only=true"

      - name: Resolve issue number
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
          ISSUE_FROM_INPUT: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE="$ISSUE_FROM_INPUT"
          else
            ISSUE="$ISSUE_FROM_EVENT"
          fi
          test -n "$ISSUE"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          DELIVERY="wake-${RUN_ID}-${ISSUE}-${COMMENT_ID:-nolabel}"
          echo "delivery_id=$DELIVERY" >> "$GITHUB_OUTPUT"

      # Checkout so the queue gate can invoke the canonical Node predicate
      # (shouldDeliverCursorWake) instead of a divergent shell reimplementation.
      - name: Checkout canonical wake-ingress predicate
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cursor-bridge/lib/wake-ingress.mjs
          sparse-checkout-cone-mode: false

      - name: Enforce Cursor-only routing before queue write
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ steps.meta.outputs.issue }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          LABEL_NAME: ${{ github.event.label.name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Canonical gate: scripts/cursor-bridge/lib/wake-ingress.mjs (shouldDeliverCursorWake).
          # Job-level if: is a coarse filter; this step is the single authority before queue write.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_LABELS=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            ISSUE_STATE=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json state --jq '.state')
            export ISSUE_LABELS ISSUE_STATE
          fi
          node --input-type=module <<'EOF'
          import { shouldDeliverCursorWake } from './scripts/cursor-bridge/lib/wake-ingress.mjs';

          const labels = String(process.env.ISSUE_LABELS || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          const decision = shouldDeliverCursorWake({
            repository: process.env.REPOSITORY,
            eventName: process.env.EVENT_NAME,
            action: process.env.ACTION || '',
            labelName: process.env.LABEL_NAME || '',
            issueLabels: labels,
            issueState: process.env.ISSUE_STATE || '',
            commentBody: process.env.COMMENT_BODY || '',
            actor: process.env.ACTOR || '',
          });
          if (!decision.deliver) {
            console.error(
              `cursor_wake_ingress_reject: ${decision.reason} (issue #${process.env.ISSUE})`,
            );
            process.exit(1);
          }
          console.log(`cursor_routing_ok=true reason=${decision.reason}`);
          EOF

      - name: Write wake packet on host
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          DELIVERY_ID: ${{ steps.meta.outputs.delivery_id }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          HOME_DIR="${LGFC_CURSOR_BRIDGE_HOME:-$HOME/lgfc-cursor-bridge}"
          QUEUE="$HOME_DIR/queue"
          mkdir -p "$QUEUE"
          chmod 700 "$HOME_DIR" "$QUEUE" || true
          PACKET="$QUEUE/${DELIVERY_ID}.json"
          export PACKET
          umask 077
          python3 <<'PY'
          import json, os, datetime
          packet = {
            "schemaVersion": 1,
            "issueNumber": int(os.environ["ISSUE"]),
            "deliveryId": os.environ["DELIVERY_ID"],
            "eventName": os.environ["EVENT_NAME"],
            "actor": os.environ.get("ACTOR") or "unknown",
            "resumeHint": os.environ.get("COMMENT_URL") or "",
            "deliveredAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "runId": os.environ.get("GITHUB_RUN_ID"),
          }
          path = os.environ["PACKET"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(packet, f, indent=2)
              f.write("\n")
          print(f"Wrote wake packet: {path}")
          PY

      - name: Optional delivery ack (not started)
        if: success()
        env:
          ISSUE: ${{ steps.meta.outputs.issue }}
          DELIVERY_ID: ${{ steps.meta.outputs.delivery_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'CURSOR BRIDGE ACK: delivered\nDelivery id: %s\nRole: wake packet only — Bridge must revalidate eligibility before any Cursor launch.\n' "$DELIVERY_ID")
          gh issue comment "$ISSUE" --repo wdhunter645/next-starter-template --body "$BODY"

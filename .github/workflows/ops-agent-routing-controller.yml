name: OPS — Agent Routing Controller (Remediation + Component Integration)

# #2677-001 / #2770 — read-only foundation with GitHub-native live collection.
# #2677-002 / #2771 — bounded source-Issue remediation routing on that packet.
# #2677-003 / #2772 — authorized non-main component-integration plus exact
# post-integration verification.
# Optional hint snapshots are compared against live evidence and cannot substitute.
# The route job emits response/resume/escalation/integrate/verify instructions
# with read-only permissions. The separate integration job may perform one exact
# component merge; neither job may close, relabel, activate successors, or
# mutate main.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controller operation
        required: true
        default: route
        type: choice
        options:
          - route
          - integrate-component
      issue_number:
        description: Source Issue number for GitHub-native live collection
        required: true
        type: string
      pr_number:
        description: Related pull request number for GitHub-native live collection
        required: true
        type: string
      hint_path:
        description: Optional repository-relative JSON hint snapshot compared against live reads
        required: false
        type: string
      output_path:
        description: Repository-relative output path for the evidence packet artifact content
        required: false
        default: reports/agent-routing/controller-packet.json
        type: string
      expected_head_sha:
        description: Exact expected PR head SHA (required for integrate-component)
        required: false
        type: string
      target_branch:
        description: Exact component target branch (required for integrate-component)
        required: false
        type: string
      expected_target_head_sha:
        description: Exact expected target-head SHA (required for integrate-component)
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: ops-agent-routing-controller-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Route remediation and component-integration instructions
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      inputs.operation == 'route'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm bounded routing and component-integration capabilities
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("config/agent-routing/controller.json", "utf8"));
            if (cfg.mode !== "observe-only") process.exit(1);
            if (cfg.mutationAllowed !== false) process.exit(1);
            if (cfg.labelsAreAuthority !== false) process.exit(1);
            if (cfg.rereadBeforePacket !== true) process.exit(1);
            if (cfg.rejectStaleHeadSha !== true) process.exit(1);
            if (cfg.remediationRouting?.enabled !== true) process.exit(1);
            if (cfg.remediationRouting?.sourceIssueOnly !== true) process.exit(1);
            if (typeof cfg.componentIntegration?.enabled !== "boolean") process.exit(1);
            if (cfg.componentIntegration.enabled) {
              if (cfg.componentIntegration?.allowMain !== false) process.exit(1);
              if (cfg.componentIntegration?.allowProduction !== false) process.exit(1);
              if (Number(cfg.componentIntegration?.maxIntegrationsPerRun) !== 1) process.exit(1);
              if (!Array.isArray(cfg.componentIntegration?.trustedReviewAuthors) || cfg.componentIntegration.trustedReviewAuthors.length === 0) process.exit(1);
              if (!Array.isArray(cfg.componentIntegration?.trustedIntegrationAuthorizationAuthors) || cfg.componentIntegration.trustedIntegrationAuthorizationAuthors.length === 0) process.exit(1);
            }
            const caps = cfg.workflowCapabilities || {};
            for (const key of ["merge","close","relabel","resume","activateSuccessor","mutateMain"]) {
              if (caps[key] !== false) {
                console.error("capability must be false:", key);
                process.exit(1);
              }
            }
            const routingCaps = cfg.remediationRouting.capabilities || {};
            for (const key of ["response","resume","escalation"]) {
              if (routingCaps[key] !== true) process.exit(1);
            }
            const integrationCaps = cfg.componentIntegration.capabilities || {};
            if (cfg.componentIntegration.enabled) {
              if (integrationCaps.integrate !== true) process.exit(1);
              if (integrationCaps.verify !== true) process.exit(1);
              if (integrationCaps.close !== false) process.exit(1);
              if (integrationCaps.activateSuccessor !== false) process.exit(1);
            }
            console.log("bounded_routing_and_component_integration_confirmed");
          '

      - name: Refuse write permissions in this workflow
        run: |
          node -e '
            const fs = require("fs");
            const yaml = fs.readFileSync(".github/workflows/ops-agent-routing-controller.yml", "utf8");
            const permBlock = yaml.match(/^permissions:\n([\s\S]*?)(?=\n\S|\nconcurrency:)/m);
            if (!permBlock) {
              console.error("permissions block missing");
              process.exit(1);
            }
            if (/\bwrite\b/.test(permBlock[1])) {
              console.error("write permission forbidden in observe-only workflow");
              process.exit(1);
            }
            console.log("read_only_permissions_confirmed");
          '

      - name: Run controller with live GitHub reread
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HINT_PATH: ${{ inputs.hint_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$ISSUE_NUMBER"
          test -n "$PR_NUMBER"
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          ARGS=(
            --config config/agent-routing/controller.json
            --issue "$ISSUE_NUMBER"
            --pr "$PR_NUMBER"
            --repository "$GITHUB_REPOSITORY"
            --output "$OUTPUT_PATH"
          )
          if [ -n "$HINT_PATH" ]; then
            test -f "$HINT_PATH"
            ARGS+=(--input "$HINT_PATH")
          fi
          node scripts/agent-routing/controller.mjs "${ARGS[@]}"

      - name: Upload controller packet artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-controller-packet
          path: ${{ inputs.output_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Write step summary
        if: always()
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "## Agent routing controller (remediation + component integration)"
            echo
            echo "- Mode: observe-only evidence plus transaction instruction output"
            echo "- Workflow mutation allowed: false"
            echo "- Live GitHub reread: required"
            echo "- Component integration instructions: enabled (non-main only)"
            echo "- Closeout/successor/main mutation: disabled"
            echo "- Issue: \`#$ISSUE_NUMBER\`"
            echo "- PR: \`#$PR_NUMBER\`"
            echo "- Output: \`$OUTPUT_PATH\`"
            if [ -f "$OUTPUT_PATH" ]; then
              echo
              echo '```json'
              head -c 8000 "$OUTPUT_PATH"
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  integrate-component:
    name: Integrate one authorized component PR
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      inputs.operation == 'integrate-component'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ops-agent-component-integration-${{ inputs.target_branch }}
      cancel-in-progress: false
    permissions:
      contents: "write"
      issues: read
      pull-requests: "write"
      checks: read
      actions: read
    steps:
      - name: Validate exact integration inputs
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_TARGET_HEAD_SHA: ${{ inputs.expected_target_head_sha }}
        run: |
          test -n "$ISSUE_NUMBER"
          test -n "$PR_NUMBER"
          test -n "$EXPECTED_HEAD_SHA"
          test -n "$TARGET_BRANCH"
          test -n "$EXPECTED_TARGET_HEAD_SHA"
          case "$TARGET_BRANCH" in
            component/*) ;;
            *) echo "target must be component/*" >&2; exit 1 ;;
          esac

      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute one bounded component integration
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_TARGET_HEAD_SHA: ${{ inputs.expected_target_head_sha }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          node scripts/agent-routing/controller.mjs \
            --integrate \
            --config config/agent-routing/controller.json \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --target-branch "$TARGET_BRANCH" \
            --expected-target-head "$EXPECTED_TARGET_HEAD_SHA" \
            --output "$OUTPUT_PATH"

      - name: Upload integration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-component-integration-result
          path: ${{ inputs.output_path }}
          if-no-files-found: error
          retention-days: 30

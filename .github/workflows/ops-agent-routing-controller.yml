name: OPS — Agent Routing Controller (Remediation + Component Integration + Closeout)

# #2677-001 / #2770 — read-only foundation with GitHub-native live collection.
# #2677-002 / #2771 — bounded source-Issue remediation routing on that packet.
# #2677-003 / #2772 — authorized non-main component integration plus exact verification.
# #2677-004 / #2773 — verified assigned-child closeout and exactly one successor wake.
# The route job remains read-only. Component integration and closeout use separate,
# narrowly write-scoped jobs. No job may mutate main or Production.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controller operation
        required: true
        default: route
        type: choice
        options:
          - route
          - integrate-component
          - closeout-successor
      issue_number:
        description: Source Issue number
        required: true
        type: string
      pr_number:
        description: Related pull request number
        required: true
        type: string
      hint_path:
        description: Optional repository-relative JSON hint snapshot compared against live reads
        required: false
        type: string
      output_path:
        description: Repository-relative output path for the controller result
        required: false
        default: reports/agent-routing/controller-packet.json
        type: string
      expected_head_sha:
        description: Exact expected PR head SHA
        required: false
        type: string
      target_branch:
        description: Exact component target branch
        required: false
        type: string
      expected_target_head_sha:
        description: Exact expected target-head SHA (required for integrate-component)
        required: false
        type: string
      integration_sha:
        description: Exact verified component integration SHA (required for closeout-successor)
        required: false
        type: string
      successor_issue_number:
        description: Exact explicit successor Issue number (required for closeout-successor)
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: ops-agent-routing-controller-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Route remediation and component-integration instructions
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      inputs.operation == 'route'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm bounded controller capabilities
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("config/agent-routing/controller.json", "utf8"));
            if (cfg.mode !== "observe-only") process.exit(1);
            if (cfg.mutationAllowed !== false) process.exit(1);
            if (cfg.labelsAreAuthority !== false) process.exit(1);
            if (cfg.rereadBeforePacket !== true) process.exit(1);
            if (cfg.rejectStaleHeadSha !== true) process.exit(1);
            if (cfg.remediationRouting?.enabled !== true) process.exit(1);
            if (cfg.remediationRouting?.sourceIssueOnly !== true) process.exit(1);
            if (typeof cfg.componentIntegration?.enabled !== "boolean") process.exit(1);
            if (typeof cfg.closeoutSuccessor?.enabled !== "boolean") process.exit(1);
            if (cfg.reconciliation?.role !== "safety-net") process.exit(1);
            if (cfg.reconciliation?.primaryPath !== "event-driven") process.exit(1);
            if (cfg.reconciliation?.mutationAllowed !== false) process.exit(1);
            if (cfg.mutationSwitches?.reconciliationMutations !== false) process.exit(1);
            if (typeof cfg.observability?.enabled !== "boolean") process.exit(1);
            if (cfg.componentIntegration.enabled) {
              if (cfg.componentIntegration?.allowMain !== false) process.exit(1);
              if (cfg.componentIntegration?.allowProduction !== false) process.exit(1);
              if (Number(cfg.componentIntegration?.maxIntegrationsPerRun) !== 1) process.exit(1);
              if (!Array.isArray(cfg.componentIntegration?.trustedReviewAuthors) || cfg.componentIntegration.trustedReviewAuthors.length === 0) process.exit(1);
              if (!Array.isArray(cfg.componentIntegration?.trustedIntegrationAuthorizationAuthors) || cfg.componentIntegration.trustedIntegrationAuthorizationAuthors.length === 0) process.exit(1);
            }
            if (cfg.closeoutSuccessor.enabled) {
              if (cfg.closeoutSuccessor?.allowMain !== false) process.exit(1);
              if (cfg.closeoutSuccessor?.allowProduction !== false) process.exit(1);
              if (Number(cfg.closeoutSuccessor?.maxTransactionsPerRun) !== 1) process.exit(1);
              if (!Array.isArray(cfg.closeoutSuccessor?.trustedDecisionAuthors) || cfg.closeoutSuccessor.trustedDecisionAuthors.length === 0) process.exit(1);
            }
            const caps = cfg.workflowCapabilities || {};
            for (const key of ["merge","close","relabel","resume","activateSuccessor","mutateMain"]) {
              if (caps[key] !== false) process.exit(1);
            }
            console.log("bounded_controller_capabilities_confirmed");
          '

      - name: Refuse global write permissions
        run: |
          node -e '
            const fs = require("fs");
            const yaml = fs.readFileSync(".github/workflows/ops-agent-routing-controller.yml", "utf8");
            const permBlock = yaml.match(/^permissions:\n([\s\S]*?)(?=\n\S|\nconcurrency:)/m);
            if (!permBlock || /\bwrite\b/.test(permBlock[1])) process.exit(1);
            console.log("global_read_only_permissions_confirmed");
          '

      - name: Run controller with live GitHub reread
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HINT_PATH: ${{ inputs.hint_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$ISSUE_NUMBER"
          test -n "$PR_NUMBER"
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          ARGS=(
            --config config/agent-routing/controller.json
            --issue "$ISSUE_NUMBER"
            --pr "$PR_NUMBER"
            --repository "$GITHUB_REPOSITORY"
            --output "$OUTPUT_PATH"
          )
          if [ -n "$HINT_PATH" ]; then
            test -f "$HINT_PATH"
            ARGS+=(--input "$HINT_PATH")
          fi
          node scripts/agent-routing/controller.mjs "${ARGS[@]}"

      - name: Upload controller packet artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-controller-packet
          path: ${{ inputs.output_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Write route summary
        if: always()
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "## Agent routing controller (read-only route)"
            echo
            echo "- Workflow mutation allowed: false"
            echo "- Live GitHub reread: required"
            echo "- Issue: \`#$ISSUE_NUMBER\`"
            echo "- PR: \`#$PR_NUMBER\`"
            echo "- Output: \`$OUTPUT_PATH\`"
            if [ -f "$OUTPUT_PATH" ]; then
              echo
              echo '```json'
              head -c 8000 "$OUTPUT_PATH"
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  integrate-component:
    name: Integrate one authorized component PR
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      inputs.operation == 'integrate-component'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ops-agent-component-integration-${{ inputs.target_branch }}
      cancel-in-progress: false
    permissions:
      contents: "write"
      issues: read
      pull-requests: "write"
      checks: read
      actions: read
    steps:
      - name: Validate exact integration inputs
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_TARGET_HEAD_SHA: ${{ inputs.expected_target_head_sha }}
        run: |
          test -n "$ISSUE_NUMBER"
          test -n "$PR_NUMBER"
          test -n "$EXPECTED_HEAD_SHA"
          test -n "$TARGET_BRANCH"
          test -n "$EXPECTED_TARGET_HEAD_SHA"
          case "$TARGET_BRANCH" in
            component/*) ;;
            *) echo "target must be component/*" >&2; exit 1 ;;
          esac

      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute one bounded component integration
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_TARGET_HEAD_SHA: ${{ inputs.expected_target_head_sha }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          node scripts/agent-routing/controller.mjs \
            --integrate \
            --config config/agent-routing/controller.json \
            --issue "$ISSUE_NUMBER" \
            --pr "$PR_NUMBER" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --target-branch "$TARGET_BRANCH" \
            --expected-target-head "$EXPECTED_TARGET_HEAD_SHA" \
            --output "$OUTPUT_PATH"

      - name: Upload integration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-component-integration-result
          path: ${{ inputs.output_path }}
          if-no-files-found: error
          retention-days: 30

  closeout-successor:
    name: Close one verified child and activate one successor
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      inputs.operation == 'closeout-successor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ops-agent-closeout-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: "write"
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Validate exact closeout inputs
        env:
          SOURCE_ISSUE: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
          SUCCESSOR_ISSUE: ${{ inputs.successor_issue_number }}
        run: |
          test -n "$SOURCE_ISSUE"
          test -n "$PR_NUMBER"
          test -n "$EXPECTED_HEAD_SHA"
          test -n "$TARGET_BRANCH"
          test -n "$INTEGRATION_SHA"
          test -n "$SUCCESSOR_ISSUE"
          test "$SOURCE_ISSUE" != "$SUCCESSOR_ISSUE"
          case "$TARGET_BRANCH" in
            component/*) ;;
            *) echo "target must be component/*" >&2; exit 1 ;;
          esac

      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm closeout-only write boundary
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("config/agent-routing/controller.json", "utf8"));
            const c = cfg.closeoutSuccessor;
            if (c?.enabled !== true || c.allowMain !== false || c.allowProduction !== false) process.exit(1);
            if (Number(c.maxTransactionsPerRun) !== 1) process.exit(1);
            if (c.capabilities?.close !== true || c.capabilities?.reportParent !== true) process.exit(1);
            if (c.capabilities?.activateSuccessor !== true || c.capabilities?.resume !== true) process.exit(1);
            if (c.capabilities?.merge !== false || c.capabilities?.mutateMain !== false) process.exit(1);
            console.log("closeout_successor_boundary_confirmed");
          '

      - name: Execute one verified closeout and successor transaction
        env:
          SOURCE_ISSUE: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
          SUCCESSOR_ISSUE: ${{ inputs.successor_issue_number }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          node scripts/agent-routing/lib/child-closeout-guard.mjs \
            --config config/agent-routing/controller.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-issue "$SOURCE_ISSUE" \
            --pr "$PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --target-branch "$TARGET_BRANCH" \
            --integration-sha "$INTEGRATION_SHA" \
            --successor "$SUCCESSOR_ISSUE" \
            --output "$OUTPUT_PATH"

      - name: Upload closeout result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-closeout-successor-result
          path: ${{ inputs.output_path }}
          if-no-files-found: error
          retention-days: 30

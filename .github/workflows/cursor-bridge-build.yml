name: Cursor Bridge Build

# Rebuild and promote the Chromebook Bridge from one immutable main commit (#2814).
# Invoked when Bridge Watch returns rebuild_required, or by authorized manual dispatch.

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable main commit SHA to install
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: cursor-bridge-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wdhunter645/next-starter-template'
    runs-on: [self-hosted, linux, x64, lgfc-repo-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout requested immutable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Refuse symbolic or non-main identities
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test -n "$SOURCE_COMMIT"
          echo "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          FULL="$(git rev-parse "$SOURCE_COMMIT")"
          test "$FULL" = "$SOURCE_COMMIT"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main

      - name: Run Bridge Build
        env:
          LGFC_BRIDGE_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          HOME_DIR="${LGFC_CURSOR_BRIDGE_HOME:-$HOME/lgfc-cursor-bridge}"
          export LGFC_CURSOR_BRIDGE_HOME="$HOME_DIR"
          export LGFC_CURSOR_BRIDGE_WORKSPACE="${LGFC_CURSOR_BRIDGE_WORKSPACE:-$GITHUB_WORKSPACE}"
          RESULT=/tmp/lgfc-bridge-build-result.json
          set +e
          node "$GITHUB_WORKSPACE/scripts/cursor-bridge/bridge-build.mjs" "$LGFC_BRIDGE_SOURCE_COMMIT" >"$RESULT" 2>/tmp/lgfc-bridge-build-stderr.txt
          NODE_RC=$?
          set -e
          # Always scan before any classification print; never echo unscanned result content.
          if [ ! -s "$RESULT" ]; then
            echo "bridge-build produced empty result (exit=$NODE_RC)" >&2
            exit 1
          fi
          if grep -qE 'CURSOR_API_KEY=|ghp_[A-Za-z0-9]+|github_pat_' "$RESULT"; then
            echo "secret-bearing output refused" >&2
            exit 1
          fi
          if [ "$NODE_RC" -ne 0 ]; then
            echo "bridge-build failed (exit=$NODE_RC)" >&2
            exit 1
          fi
          CLASS="$(python3 - <<'PY'
import json
from pathlib import Path
raw = Path("/tmp/lgfc-bridge-build-result.json").read_text().strip()
data = json.loads(raw)
print(data.get("classification") or "unknown")
PY
)"
          echo "classification=$CLASS"
          case "$CLASS" in
            promoted|rebuild_deferred) exit 0 ;;
            *) exit 1 ;;
          esac

name: Workflow health reconcile

on:
  workflow_dispatch:
  schedule:
    # Artifact refresh cadence (reporting only). Informational pickup/idle
    # watcher interval remains 5 minutes via config/SLO + local wake loop;
    # this job must not burn Actions minutes on a 5-minute cron.
    - cron: "0 */6 * * *"
  pull_request:
    paths:
      - ".github/workflows/workflow-health-reconcile.yml"
      - "scripts/workflow-health/**"
      - "tests/workflow-health/**"
      - "docs/reference/operations/workflow-health-reconciliation-and-operator-handoff.md"
      - "docs/how-to/operations/run-workflow-health-reconciliation.md"
  push:
    paths:
      - ".github/workflows/workflow-health-reconcile.yml"
      - "scripts/workflow-health/**"
      - "tests/workflow-health/**"
      - "docs/reference/operations/workflow-health-reconciliation-and-operator-handoff.md"
      - "docs/how-to/operations/run-workflow-health-reconciliation.md"

permissions:
  contents: read

env:
  WORKFLOW_HEALTH_OUT_DIR: site/workflow-health

jobs:
  pilot:
    name: Seeded pilot and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run workflow-health unit tests
        run: npx vitest run tests/workflow-health

      - name: Run seeded pilot
        run: node scripts/workflow-health/pilot.mjs

      - name: Write pilot summary
        run: |
          echo "## Workflow-health pilot" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic seeded-failure pilot and unit tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Derived-state only — no GitHub execution authority mutation." >> "$GITHUB_STEP_SUMMARY"

  generate:
    name: Generate reconciled views artifact
    # Qualification gate: an unqualified reconciliation view must not publish.
    needs: pilot
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      WORKFLOW_HEALTH_DISABLED: ${{ vars.WORKFLOW_HEALTH_DISABLED || '' }}
      WORKFLOW_HEALTH_STORE_FILE: .workflow-health-store/reconcile-store.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Derived state persists between scheduled runs via the Actions cache so
      # retention and historical reconciliation operate on retained evidence.
      # Cache loss degrades to a gap-visible empty state, never invented health.
      - name: Restore prior reconcile store
        uses: actions/cache/restore@v4
        with:
          path: .workflow-health-store
          key: workflow-health-store-${{ github.run_id }}
          restore-keys: |
            workflow-health-store-

      # Incoming envelopes remain empty until an authorized live collector
      # exists (see how-to preconditions); reconciliation still repairs and
      # re-ages the retained store restored above.
      - name: Reconcile retained store plus incoming envelopes
        id: reconcile
        run: |
          set -euo pipefail
          OUT_FILE="$(mktemp)"
          node scripts/workflow-health/reconcile.mjs | tee "$OUT_FILE"
          echo "disabled=$(jq -r 'if .disabled then "1" else "0" end' "$OUT_FILE")" >> "$GITHUB_OUTPUT"

      - name: Persist reconcile store for the next scheduled run
        if: ${{ steps.reconcile.outputs.disabled != '1' }}
        run: |
          mkdir -p .workflow-health-store
          cp "$WORKFLOW_HEALTH_OUT_DIR/reconcile-store.json" .workflow-health-store/reconcile-store.json

      - name: Save reconcile store cache
        if: ${{ steps.reconcile.outputs.disabled != '1' }}
        uses: actions/cache/save@v4
        with:
          path: .workflow-health-store
          key: workflow-health-store-${{ github.run_id }}

      # Gating reads the runtime disable decision from the reconcile step
      # output so the disable semantics ('1'|'true'|'yes', resolved by
      # config.mjs) have a single source of truth.
      - name: Upload workflow-health artifact
        if: ${{ steps.reconcile.outputs.disabled != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-health
          path: ${{ env.WORKFLOW_HEALTH_OUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Write generate summary
        run: |
          echo "## Workflow-health reconcile generate" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact generation is reporting-only. Production promotion remains a separate Product Authority decision." >> "$GITHUB_STEP_SUMMARY"

name: Normalize retired-name cleanup once

on:
  push:
    branches:
      - chatgpt/2734-remove-retired-assistant-name

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/2734-remove-retired-assistant-name

      - name: Normalize replacement artifacts and verify
        shell: bash
        run: |
          set -e
          branch='chatgpt/2734-remove-retired-assistant-name'
          workflow='.github/workflows/normalize-retired-name-cleanup-once.yml'

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git grep -I -l -z -E 'ChatGPT[[:space:]]*/[[:space:]]*ChatGPT|ChatGPT[[:space:]]*\+[[:space:]]*ChatGPT|ChatGPT[[:space:]]*\([[:space:]]*ChatGPT[[:space:]]*\)' -- . ":(exclude)$workflow" || true)

          if [ "${#files[@]}" -gt 0 ]; then
            perl -0pi -e 's/\bChatGPT\s*\/\s*ChatGPT\b/ChatGPT/g; s/\bChatGPT\s*\+\s*ChatGPT\b/ChatGPT/g; s/\bChatGPT\s*\(\s*ChatGPT\s*\)/ChatGPT/g' "${files[@]}"
          fi

          if [ -f 'docs/reference/test-atlas-doc.md' ]; then
            git mv 'docs/reference/test-atlas-doc.md' 'docs/reference/test-chatgpt-doc.md'
          fi

          reference_files=()
          while IFS= read -r -d '' file; do
            reference_files+=("$file")
          done < <(git grep -I -l -z -F 'test-ChatGPT-doc.md' -- . ":(exclude)$workflow" || true)
          if [ "${#reference_files[@]}" -gt 0 ]; then
            perl -0pi -e 's/test-ChatGPT-doc\.md/test-chatgpt-doc.md/g' "${reference_files[@]}"
          fi

          rm "$workflow"

          if git grep -I -n -i -w 'atlas' -- .; then
            echo 'Retired-name content matches remain.'
            exit 1
          fi

          if git ls-files | grep -Eiq '(^|[^[:alnum:]_])atlas([^[:alnum:]_]|$)'; then
            echo 'Retired-name path matches remain.'
            git ls-files | grep -Ei '(^|[^[:alnum:]_])atlas([^[:alnum:]_]|$)'
            exit 1
          fi

          if git grep -I -n -E 'ChatGPT[[:space:]]*/[[:space:]]*ChatGPT|ChatGPT[[:space:]]*\+[[:space:]]*ChatGPT|ChatGPT[[:space:]]*\([[:space:]]*ChatGPT[[:space:]]*\)' -- .; then
            echo 'Duplicate replacement artifacts remain.'
            exit 1
          fi

          node -e "const fs=require('fs'); for (const f of ['.github/orchestrator-labels.json','.github/orchestrator-routing.json']) JSON.parse(fs.readFileSync(f,'utf8'));"
          git diff --check
          git status --short

          git config user.name 'LGFC Repository Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize ChatGPT replacement output'
          git push origin "HEAD:$branch"

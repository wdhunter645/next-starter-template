name: PMO dashboard CI deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PMO dashboard CI build"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/pmo-dashboard-ci-deploy.yml"

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pmo-dashboard-pages
  cancel-in-progress: false

env:
  PMO_DASHBOARD_OUT_DIR: site/pmo-dashboard

jobs:
  deploy:
    name: Deploy PMO dashboard to GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout workflow run head
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout repository
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dashboard for deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pmo-dashboard/build-dashboard.mjs

      - name: Validate deploy artifact
        run: node scripts/pmo-dashboard/validate-dashboard.mjs "$PMO_DASHBOARD_OUT_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PMO_DASHBOARD_OUT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deploy summary
        run: |
          echo "## PMO dashboard CI deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Published dashboard URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

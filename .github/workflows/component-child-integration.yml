name: Component Child Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'component/**'
  # Deterministic settle reevaluation after required peer gates complete.
  workflow_run:
    workflows:
      - 'GATE — Quality Checks'
      - 'GATE — Diff Scope'
      - 'GATE — Secret Scan'
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

env:
  # Accounts authorized to post an exact-head `<!-- lgfc-role-approval:v1 -->`
  # approval-evidence event. This does not authenticate the PR Approver /
  # Engineering role holder specifically — ChatGPT and Claude Code currently
  # both write through this same account — it only rejects evidence posted
  # by an outside collaborator or a bot.
  ROLE_APPROVAL_AUTHORIZED_ACCOUNTS: wdhunter645

jobs:
  component-child-integration:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != null &&
       github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              HEAD_SHA="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
              PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                --jq '[.[] | select(.base.ref|test("^component/")) | .number][0] // empty')"
            fi
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "No component child PR associated with this workflow_run; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "number=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE_REF="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)"
            case "$BASE_REF" in
              component/*) ;;
              *)
                echo "Base ref ${BASE_REF} is not a component branch; skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "number=0" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR metadata
        id: pr_meta
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          DRAFT="$(jq -r '.draft' "$RUNNER_TEMP/pr.json")"
          if [ "$DRAFT" = "true" ]; then
            echo "PR is draft; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr_body.md"
          jq -r '.base.ref' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/base_ref.txt"
          jq -r '.head.ref' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/head_ref.txt"
          jq -r '.head.sha' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/head_sha.txt"
          jq -r '.base.sha' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/base_sha.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            | jq -r '.[].filename' > "$RUNNER_TEMP/changed_files.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            | jq -s 'add // []' > "$RUNNER_TEMP/reviews.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate \
            | jq -s 'add // []' > "$RUNNER_TEMP/labels.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$(cat "$RUNNER_TEMP/head_sha.txt")/check-runs" --paginate \
            | jq -s '[.[].check_runs[] | {name, conclusion, status, completed_at, started_at, id}]' \
            > "$RUNNER_TEMP/checks.json"

          SOURCE_ISSUE="$(node --input-type=module -e "
            import fs from 'node:fs';
            const body = fs.readFileSync(process.argv[1], 'utf8');
            const match = body.match(/^\\s*-?\\s*(?:\\*\\*)?Issue:(?:\\*\\*)?\\s*#(\\d+)\\b/im);
            process.stdout.write(match?.[1] || '0');
          " "$RUNNER_TEMP/pr_body.md")"
          if [ "$SOURCE_ISSUE" != "0" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${SOURCE_ISSUE}/comments" --paginate \
              | jq -s 'add // []' > "$RUNNER_TEMP/source_issue_comments.json"
          else
            echo '[]' > "$RUNNER_TEMP/source_issue_comments.json"
          fi

          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
          IMPLEMENTATION_ACTOR=""
          case "$HEAD_REF" in
            atlas/*) IMPLEMENTATION_ACTOR="ChatGPT" ;;
          esac

          node --input-type=module -e "
            import fs from 'node:fs';
            fs.writeFileSync(
              process.argv[1],
              JSON.stringify((process.env.ROLE_APPROVAL_AUTHORIZED_ACCOUNTS || '').split(',').map((s) => s.trim()).filter(Boolean)),
            );
          " "$RUNNER_TEMP/role_approval_authorized_accounts.json"

          {
            echo "base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")"
            echo "head_ref=${HEAD_REF}"
            echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
            echo "source_issue=${SOURCE_ISSUE}"
            echo "implementation_actor=${IMPLEMENTATION_ACTOR}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted component base
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_meta.outputs.base_ref }}
          fetch-depth: 0

      - name: Resolve component branch freshness
        id: freshness
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        run: |
          BASE_REF="$(cat "$RUNNER_TEMP/base_ref.txt")"
          BASE_SHA="$(cat "$RUNNER_TEMP/base_sha.txt")"
          git fetch origin "$BASE_REF"
          COMPONENT_HEAD="$(git rev-parse "origin/${BASE_REF}")"
          if [ "$BASE_SHA" = "$COMPONENT_HEAD" ]; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
          else
            BEHIND="$(git rev-list --count "${BASE_SHA}..${COMPONENT_HEAD}")"
            echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          fi
          echo "component_head=${COMPONENT_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Resolve component integration state
        id: component_state
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_REF="$(cat "$RUNNER_TEMP/base_ref.txt")"
          COMPONENT_HEAD="${{ steps.freshness.outputs.component_head }}"
          STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMPONENT_HEAD}/status")"
          STATE="$(echo "$STATUS_JSON" | jq -r '.state')"
          case "$STATE" in
            failure|error) echo "state=red" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=green" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "branch=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "combined_status=${STATE}" >> "$GITHUB_OUTPUT"

      - name: Evaluate component integration eligibility
        id: eligibility
        if: steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
          PR_BASE_REF: ${{ steps.pr_meta.outputs.base_ref }}
          PR_HEAD_REF: ${{ steps.pr_meta.outputs.head_ref }}
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed_files.txt
          COMPONENT_INTEGRATION_CHECKS_JSON: ${{ runner.temp }}/checks.json
          COMPONENT_INTEGRATION_REVIEWS_JSON: ${{ runner.temp }}/reviews.json
          COMPONENT_INTEGRATION_LABELS_JSON: ${{ runner.temp }}/labels.json
          COMPONENT_INTEGRATION_SOURCE_ISSUE_COMMENTS_JSON: ${{ runner.temp }}/source_issue_comments.json
          COMPONENT_INTEGRATION_STATE: ${{ steps.component_state.outputs.state }}
          COMPONENT_INTEGRATION_BASE_BEHIND: ${{ steps.freshness.outputs.behind }}
          COMPONENT_INTEGRATION_HEAD_SHA: ${{ steps.pr_meta.outputs.head_sha }}
          COMPONENT_INTEGRATION_PR_NUMBER: ${{ steps.pr.outputs.number }}
          COMPONENT_INTEGRATION_IMPLEMENTATION_ACTOR: ${{ steps.pr_meta.outputs.implementation_actor }}
          COMPONENT_INTEGRATION_ROLE_APPROVAL_AUTHORIZED_ACCOUNTS_JSON: ${{ runner.temp }}/role_approval_authorized_accounts.json
          COMPONENT_INTEGRATION_RESULT_JSON: ${{ runner.temp }}/component_integration_result.json
        run: node scripts/ci/component_integration_role_adapter.mjs

      - name: Return protected PR without approval to draft
        if: steps.eligibility.outputs.role_approval_required == 'true' && steps.eligibility.outputs.role_approval_present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PR_NODE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .node_id)"
          gh api graphql \
            -f query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }' \
            -f pullRequestId="$PR_NODE_ID"

      - name: Upsert exact-head PR review request
        if: steps.eligibility.outputs.role_approval_required == 'true' && steps.eligibility.outputs.role_approval_present != 'true' && steps.pr_meta.outputs.source_issue != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE: ${{ steps.pr_meta.outputs.source_issue }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr_meta.outputs.head_sha }}
        run: |
          MARKER="<!-- lgfc-role-approval-guard:v1 -->"
          BODY_FILE="$RUNNER_TEMP/role_approval_request.md"
          cat > "$BODY_FILE" <<EOF
          ${MARKER}
          ## PR REVIEW REQUEST — EXACT-HEAD APPROVAL-EVIDENCE REQUIRED

          **Source Issue:** #${SOURCE_ISSUE}
          **PR:** #${PR_NUMBER}
          **Head SHA:** \`${HEAD_SHA}\`
          **Status:** protected component PR held in draft

          ChatGPT (PR Approver / Engineering) must inspect this exact head and either record the blocker or post the canonical \`<!-- lgfc-role-approval:v1 -->\` approval-evidence event on this Issue. Any head change invalidates the disposition.

          Note: this control provides exact-head structured approval evidence and stale-disposition prevention. It cannot cryptographically distinguish ChatGPT from other automation writing through the shared \`wdhunter645\` repository-owner account.
          EOF

          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${SOURCE_ISSUE}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | select(.body | contains(\"**PR:** #${PR_NUMBER}\")) | .id" \
            | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            jq -n --rawfile body "$BODY_FILE" '{body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input -
          else
            jq -n --rawfile body "$BODY_FILE" '{body: $body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${SOURCE_ISSUE}/comments" --input -
          fi

      - name: Upsert missing-source-issue explanation on the PR
        if: steps.eligibility.outputs.role_approval_required == 'true' && steps.eligibility.outputs.role_approval_present != 'true' && steps.pr_meta.outputs.source_issue == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr_meta.outputs.head_sha }}
        run: |
          MARKER="<!-- lgfc-role-approval-guard-missing-source:v1 -->"
          BODY_FILE="$RUNNER_TEMP/missing_source_explanation.md"
          cat > "$BODY_FILE" <<EOF
          ${MARKER}
          ## PROTECTED PR RETURNED TO DRAFT — NO SOURCE ISSUE RESOLVED

          **Head SHA:** \`${HEAD_SHA}\`

          This PR touches a protected path (or declares \`Approval profile: protected-change-review\`) and therefore requires an exact-head \`<!-- lgfc-role-approval:v1 -->\` approval-evidence event on its authoritative source Issue before component auto-integration. No \`- **Issue:** #<number>\` field could be parsed from the current PR body, so no review request could be routed anywhere and the PR was returned to draft with no other visible explanation.

          Add a stable \`- **Issue:** #<number>\` line identifying the authoritative source Issue, then push again so this control can route the required review request.
          EOF

          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            jq -n --rawfile body "$BODY_FILE" '{body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input -
          else
            jq -n --rawfile body "$BODY_FILE" '{body: $body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
          fi

      - name: Publish component integration check
        if: always() && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          REQUIRES_CHAT_REVIEW: ${{ steps.eligibility.outputs.requires_chat_review }}
          COMPONENT_STATE: ${{ steps.component_state.outputs.state }}
        run: |
          RESULT_FILE="$RUNNER_TEMP/component_integration_result.json"
          CONCLUSION="failure"
          if [ "$ELIGIBLE" = "true" ]; then
            CONCLUSION="success"
          elif [ "$REQUIRES_CHAT_REVIEW" = "true" ]; then
            CONCLUSION="neutral"
          fi
          node --input-type=module -e "
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('${RESULT_FILE}', 'utf8'));
          const lines = [
            'Component integration eligibility: ' + (result.eligible ? 'eligible' : 'blocked'),
            'Component state: ' + process.env.COMPONENT_STATE,
            'Requires Chat review: ' + (result.requiresChatReview ? 'yes' : 'no'),
          ];
          if (result.roleApproval?.required) {
            lines.push('Exact-head role approval evidence: ' + (result.roleApproval.approved ? 'present' : 'missing'));
            if (result.roleApproval.approved) {
              lines.push('Approval-evidence account: ' + (result.roleApproval.acceptedLogin || 'unknown') + ' (association: ' + (result.roleApproval.acceptedAuthorAssociation || 'unknown') + ')');
            }
            lines.push('Note: exact-head structured approval evidence, not authenticated reviewer identity — the shared wdhunter645 account does not distinguish ChatGPT from other automation.');
          } else {
            lines.push('Exact-head role approval evidence: not required');
          }
          if (result.blockedReasons.length) {
            lines.push('', 'Blocked reasons:');
            for (const reason of result.blockedReasons) lines.push('- ' + reason.code + ': ' + reason.message);
          }
          fs.writeFileSync('${RESULT_FILE}'.replace('.json', '_summary.txt'), lines.join('\n'));
          "
          SUMMARY="$(cat "$RUNNER_TEMP/component_integration_result_summary.txt")"
          HEAD_SHA="$(cat "$RUNNER_TEMP/head_sha.txt")"
          # Update the same check-run record for this name/head SHA rather than
          # accumulating a new one on every re-evaluation of the same commit.
          EXISTING_CHECK_ID="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --paginate \
            | jq -s '[.[].check_runs[] | select(.name == "Component Integration Eligibility")] | sort_by(.id) | last | .id // empty')"
          if [ -n "$EXISTING_CHECK_ID" ] && [ "$EXISTING_CHECK_ID" != "null" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${EXISTING_CHECK_ID}" \
              -f status=completed \
              -f conclusion="$CONCLUSION" \
              -f output[title]='Component child auto-integration' \
              -f output[summary]="$SUMMARY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name='Component Integration Eligibility' \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$CONCLUSION" \
              -f output[title]='Component child auto-integration' \
              -f output[summary]="$SUMMARY"
          fi

      - name: Enable auto-merge for eligible child PRs
        if: steps.eligibility.outputs.eligible == 'true' && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          ALLOW_AUTO_MERGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [ "$ALLOW_AUTO_MERGE" != "true" ]; then
            echo "Skipping auto-merge enablement: repository allow_auto_merge=${ALLOW_AUTO_MERGE}."
            exit 0
          fi
          gh api graphql -f query='
            mutation($pullRequestId: ID!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId,
                mergeMethod: SQUASH
              }) {
                pullRequest { autoMergeRequest { enabledAt } }
              }
            }' -f pullRequestId="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .node_id)"

      - name: Upload component integration artifact
        if: always() && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-integration-result-${{ steps.pr.outputs.number || github.run_id }}
          path: ${{ runner.temp }}/component_integration_result.json
          if-no-files-found: ignore

      - name: Integration blocked
        if: steps.eligibility.outputs.eligible != 'true' && steps.pr.outputs.skip != 'true' && steps.pr_meta.outputs.skip != 'true'
        run: |
          echo "Component child auto-integration is blocked for PR #${{ steps.pr.outputs.number }}."
          exit 0

name: LGFC D1 Migrate (remote)

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: Migration SQL file path (under migrations/)
        required: true
        default: migrations/0041_exclude_logo_matchup_photo.sql
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run remote D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          FILE="${{ inputs.migration_file }}"
          if [ ! -f "$FILE" ]; then
            echo "Migration file not found: $FILE"
            exit 1
          fi
          echo "Applying $FILE to PRODUCTION D1 (lgfc_lite)"
          npx wrangler d1 execute lgfc_lite --remote --yes --file "$FILE"

      - name: Verify logo exclusion when applying 0041
        if: contains(inputs.migration_file, '0041_exclude_logo_matchup_photo.sql')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute lgfc_lite --remote --command \
            "SELECT id, url, is_matchup_eligible FROM photos WHERE url LIKE '%IMG_4026.jpeg%' LIMIT 1;"

name: Repository Runner Health

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUNNER_HEALTH to run the trusted repository-runner check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-runner-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.repository == 'wdhunter645/next-starter-template' &&
      github.actor == 'wdhunter645' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RUNNER_HEALTH'
    runs-on: [self-hosted, linux, x64, lgfc-repo-runner]
    timeout-minutes: 10
    steps:
      - name: Confirm trusted invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPOSITORY" = "wdhunter645/next-starter-template"
          test "$REF_NAME" = "refs/heads/main"
          test "$ACTOR" = "wdhunter645"

      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Validate repository runner contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'config/github-actions/repository-runner.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const requiredLabels = ['self-hosted', 'linux', 'x64', 'lgfc-repo-runner'];

          if (config.schemaVersion !== 1) throw new Error('Unsupported runner config schema');
          if (config.repository !== process.env.GITHUB_REPOSITORY) {
            throw new Error(`Runner config repository mismatch: ${config.repository}`);
          }
          if (config.scope !== 'repository') throw new Error('Runner must remain repository-scoped');
          if (!config.security?.publicRepository) throw new Error('Public-repository risk flag missing');
          if (config.security?.allowPullRequestEvents !== false) {
            throw new Error('Pull request execution must remain disabled');
          }
          if (config.security?.allowRepositorySecrets !== false) {
            throw new Error('Repository secrets must remain disabled for the pilot');
          }
          if (config.security?.allowProductionCredentials !== false) {
            throw new Error('Production credentials must remain disabled');
          }
          for (const label of requiredLabels) {
            if (!config.runner?.labels?.includes(label)) {
              throw new Error(`Required runner label missing: ${label}`);
            }
          }

          console.log(JSON.stringify({
            ok: true,
            runnerName: config.runner.name,
            labels: config.runner.labels,
            rollout: config.rollout,
          }, null, 2));
          NODE

      - name: Report host capability
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
          cat /etc/os-release
          node --version
          npm --version
          git --version
          df -h .
          free -h

      - name: Write health summary
        if: always()
        run: |
          {
            echo "## Repository Runner Health"
            echo
            echo "- Repository: `${{ github.repository }}`"
            echo "- Ref: `${{ github.ref }}`"
            echo "- Actor: `${{ github.actor }}`"
            echo "- Runner: `${RUNNER_NAME}`"
            echo "- OS/architecture: `${RUNNER_OS}/${RUNNER_ARCH}`"
            echo "- Mode: manual health only"
            echo "- Pull-request execution: prohibited"
            echo "- Repository secrets: prohibited"
            echo "- Production credentials and deployments: prohibited"
          } >> "$GITHUB_STEP_SUMMARY"

name: PMO Project Task Materializer

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative path to project-manifest.json
        required: true
        type: string
        default: docs/ops/implementation-plans/pmo-project-autonomous-delivery/project-manifest.json
      mode:
        description: dry-run validates only; apply mutates issues after explicit authorization
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      authorize_apply:
        description: Must be true to permit apply-mode issue mutation
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - 'docs/ops/implementation-plans/**/project-manifest.json'
      - 'scripts/pmo-projects/**'
      - 'tests/pmo-projects/**'
      - '.github/workflows/pmo-project-task-materializer.yml'
  push:
    branches:
      - 'component/**'
    paths:
      - 'docs/ops/implementation-plans/**/project-manifest.json'

permissions:
  contents: read
  issues: read

concurrency:
  group: pmo-project-task-materializer-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.authorize_apply == true && github.event.repository.fork == false && 'write' || 'read' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve event manifest selection and authorization
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'dry-run' }}
          AUTHORIZE_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_apply || false }}
          MANIFEST_PATH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.manifest_path || '' }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || github.event.repository.fork || false }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/pmo-projects/resolve-workflow-manifests.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test materializer workflow policy
        run: npx vitest run tests/pmo-projects/workflow-policy.test.mjs tests/pmo-projects/resolve-workflow-manifests.test.mjs

      - name: Validate selected manifests
        if: steps.resolve.outputs.skip != 'true'
        env:
          MANIFEST_PATHS_JSON: ${{ steps.resolve.outputs.manifest_paths_json }}
        run: |
          mapfile -t manifests < <(
            node -e 'for (const value of JSON.parse(process.env.MANIFEST_PATHS_JSON || "[]")) console.log(value)'
          )
          for manifest in "${manifests[@]}"; do
            npm run pmo:project:validate -- "$manifest"
          done

      - name: Materialize selected manifests
        if: steps.resolve.outputs.skip != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PMO_MATERIALIZE_APPLY_AUTHORIZED: ${{ steps.resolve.outputs.effective_mode == 'apply' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATHS_JSON: ${{ steps.resolve.outputs.manifest_paths_json }}
        run: |
          mkdir -p "$RUNNER_TEMP/materialize-reports"
          mapfile -t manifests < <(
            node -e 'for (const value of JSON.parse(process.env.MANIFEST_PATHS_JSON || "[]")) console.log(value)'
          )
          for manifest in "${manifests[@]}"; do
            slug="$(basename "$(dirname "$manifest")")"
            report="$RUNNER_TEMP/materialize-reports/${slug}.txt"
            if [ "${{ steps.resolve.outputs.effective_mode }}" = "apply" ]; then
              npm run pmo:project:materialize -- --apply --repo "$GITHUB_REPOSITORY" "$manifest" | tee "$report"
            else
              npm run pmo:project:materialize -- --dry-run --repo "$GITHUB_REPOSITORY" "$manifest" | tee "$report"
            fi
          done

      - name: Write job summary
        if: always()
        env:
          MANIFEST_PATHS_JSON: ${{ steps.resolve.outputs.manifest_paths_json }}
          DELETED_PATHS_JSON: ${{ steps.resolve.outputs.deleted_paths_json }}
        run: |
          {
            echo "## PMO Project Task Materializer"
            echo
            echo "- Event: `${{ github.event_name }}`"
            echo "- Effective mode: `${{ steps.resolve.outputs.effective_mode }}`"
            echo "- Authorization reason: `${{ steps.resolve.outputs.auth_reason }}`"
            echo "- Selection reason: `${{ steps.resolve.outputs.selection_reason }}`"
            echo "- Skip: `${{ steps.resolve.outputs.skip }}`"
            echo "- Selected manifests: `${MANIFEST_PATHS_JSON:-[]}`"
            echo "- Deleted manifests: `${DELETED_PATHS_JSON:-[]}`"
            echo
            if [ -d "$RUNNER_TEMP/materialize-reports" ]; then
              for report in "$RUNNER_TEMP"/materialize-reports/*.txt; do
                [ -e "$report" ] || continue
                echo "### $(basename "$report" .txt)"
                echo '```'
                cat "$report"
                echo '```'
              done
            else
              echo "_No materialization was required for this event._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload materializer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmo-project-task-materializer-${{ github.run_id }}
          path: ${{ runner.temp }}/materialize-reports
          if-no-files-found: ignore
